<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c1915" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zuniga" />
<title>Zuniga</title>
<meta name="description" content="A private home for the Zuniga family." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-180.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Outfit:wght@380;480;560&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f3eee6;
    --bg-2: #e7e0d4;
    --card: #fffaf3;
    --ink: #1c1915;
    --muted: #6f675c;
    --line: rgba(28,25,21,.1);
    --accent: #c45c26;
    --accent-ink: #fff8f3;
    --olive: #3e5344;
    --shadow: 0 10px 30px rgba(48,32,18,.08);
    --nav-h: 62px;
    --safe-b: env(safe-area-inset-bottom);
    --safe-t: env(safe-area-inset-top);
  }
  html[data-theme="dark"] {
    --bg: #141210;
    --bg-2: #221e1a;
    --card: #1c1916;
    --ink: #f4efe7;
    --muted: #a79d90;
    --line: rgba(244,239,231,.1);
    --accent-ink: #1c120c;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  html[data-accent="olive"] { --accent: #3e5344; --accent-ink: #f4f7f2; }
  html[data-accent="clay"] { --accent: #c45c26; --accent-ink: #fff8f3; }
  html[data-accent="ink"] { --accent: #243044; --accent-ink: #f4f7fb; }
  html[data-accent="gold"] { --accent: #a57a2d; --accent-ink: #1c1408; }
  html[data-theme="dark"][data-accent="olive"] { --accent: #8eae96; --accent-ink: #121814; }
  html[data-theme="dark"][data-accent="clay"] { --accent: #e08a5a; --accent-ink: #1c120c; }
  html[data-theme="dark"][data-accent="ink"] { --accent: #9eb0cc; --accent-ink: #10141c; }
  html[data-theme="dark"][data-accent="gold"] { --accent: #e0c07a; --accent-ink: #1c1408; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Outfit, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    position: relative;
    background:
      radial-gradient(900px 280px at 80% -40px, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      var(--bg);
  }
  header.top {
    position: sticky; top: 0; z-index: 5;
    padding: calc(14px + var(--safe-t)) 18px 12px;
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(16px);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
  }
  .brand { display: flex; gap: 10px; align-items: center; }
  .mark {
    width: 36px; height: 36px; border-radius: 12px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-family: Fraunces, serif; font-weight: 620; font-size: 18px;
  }
  .brand h1 { font-family: Fraunces, serif; font-size: 22px; margin: 0; font-weight: 620; letter-spacing: -.03em; }
  .brand p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; height: 36px; padding: 0 12px; font-size: 13px;
  }
  main { padding: 6px 16px calc(var(--nav-h) + var(--safe-b) + 24px); }
  .screen { display: none; animation: rise .28s ease; }
  .screen.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .composer, .card, .tile, .setting, .cal-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  }
  .composer { padding: 12px; display: flex; gap: 10px; margin-bottom: 14px; }
  .avatar, .av {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 560; flex: none; color: #fff;
  }
  textarea, input[type="text"], input[type="datetime-local"] {
    width: 100%; border: 0; background: transparent; outline: none; resize: none;
  }
  textarea { min-height: 44px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .pill {
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 999px; padding: 8px 14px; font-weight: 560; font-size: 13px;
  }
  .ghost { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 8px; }
  .card { padding: 14px; margin-bottom: 12px; }
  .meta { display: flex; gap: 10px; align-items: center; }
  .meta strong { font-size: 14px; }
  .meta span, .time { color: var(--muted); font-size: 12px; }
  .body { margin: 10px 0 0; line-height: 1.45; font-size: 15px; white-space: pre-wrap; }
  .photo {
    margin-top: 10px; border-radius: 14px; height: 180px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 55%, #cbb89a), #8d6a48);
    display: grid; place-items: end start; padding: 12px; color: white; font-size: 12px;
  }
  .embed {
    margin-top: 10px; border-radius: 14px; padding: 12px;
    background: var(--bg-2); font-size: 13px;
  }
  .embed b { display: block; margin-bottom: 4px; }
  .reply-box { margin-top: 10px; display: flex; gap: 8px; }
  .reply-box input { background: var(--bg); border-radius: 12px; padding: 8px 10px; }
  .replies { margin-top: 8px; padding-left: 8px; border-left: 2px solid var(--line); }
  .replies p { margin: 6px 0; font-size: 13px; }
  .ask {
    background: color-mix(in srgb, var(--accent) 12%, var(--card));
    border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
  }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  nav.tab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 0; width: min(480px, 100%);
    height: calc(var(--nav-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(16px);
    z-index: 6;
  }
  nav.tab button {
    border: 0; background: transparent; color: var(--muted); font-size: 11px; letter-spacing: .02em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  nav.tab button.on { color: var(--ink); font-weight: 560; }
  nav.tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
  nav.tab button.has .dot { display: block; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .seg { display: flex; background: var(--bg-2); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); }
  .month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0; }
  .day {
    aspect-ratio: 1; border: 0; background: transparent; border-radius: 12px; font-size: 13px; position: relative;
  }
  .day.has::after { display: none; }
  .day.sel { background: var(--ink); color: var(--bg); }
  .event { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .event:last-child { border-bottom: 0; }
  .who { display: flex; gap: 6px; margin-top: 8px; }
  .profile-head { text-align: center; padding: 8px 0 16px; }
  .profile-head .av { width: 84px; height: 84px; margin: 0 auto 10px; font-size: 28px; }
  .profile-head h2 { font-family: Fraunces, serif; margin: 0; font-weight: 620; }
  .status { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { min-height: 120px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
  .tile.photo-tile { color: white; border: 0; background: linear-gradient(160deg, #c45c26, #6d4128); }
  .tile small { color: var(--muted); }
  .tile.photo-tile small { color: rgba(255,255,255,.8); }
  .setting { padding: 14px; margin-bottom: 10px; }
  .setting h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; }
  .swatch.on { border-color: var(--ink); }
  .sheet {
    position: fixed; inset: 0; background: rgba(20,16,12,.45); z-index: 8;
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet.on { display: flex; }
  .sheet .panel {
    width: min(480px, 100%); background: var(--bg); border-radius: 22px 22px 0 0;
    padding: 16px 16px calc(16px + var(--safe-b)); max-height: 88vh; overflow: auto;
  }
  .empty { color: var(--muted); text-align: center; padding: 28px 10px; font-size: 14px; }
  .banner {
    font-size: 12px; color: var(--muted); background: var(--bg-2); border-radius: 12px;
    padding: 8px 10px; margin-bottom: 12px;
  }
  .splash {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center;
    background: #000;
    transition: opacity .7s ease;
  }
  .splash-z {
    width: min(240px, 58vw);
    height: auto;
    display: block;
    opacity: 0;
    transform: scale(.92);
    animation: zIn 1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes zIn { to { opacity: 1; transform: scale(1); } }
  .splash.out { opacity: 0; pointer-events: none; }
  .field {
    width: 100%; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 8px;
  }
  .suggest { position: relative; }
  .suggest-list {
    position: absolute; left: 0; right: 0; top: calc(100% - 6px); z-index: 3;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .suggest-list button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line);
  }
  .suggest-list button:last-child { border-bottom: 0; }
  .event-banner {
    height: 168px; border-radius: 16px; margin-bottom: 12px;
    background: #8d6a48 center/cover no-repeat;
  }
  .cal-dot {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin: 0 1px;
  }
  .day .dots { position: absolute; bottom: 4px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
  .color-pick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; }
  .color-pick.on { border-color: var(--ink); }
  .file-btn { border: 1px dashed var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 13px; width: 100%; text-align: left; margin-bottom: 8px; }
  .setup {
    position: fixed; inset: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 96%, #000);
    display: none; align-items: flex-end; justify-content: center;
  }
  .setup.on { display: flex; }
  .setup .panel { width: min(480px, 100%); padding: 22px 18px calc(22px + var(--safe-b)); }
  .setup h2 { font-family: Fraunces, serif; font-size: 28px; margin: 0 0 8px; letter-spacing: -.03em; }
  .setup p { color: var(--muted); line-height: 1.45; margin: 0 0 16px; }
  .home-icon { width: 84px; height: 84px; border-radius: 20px; display: block; margin: 8px 0 14px; }
  .setup-progress { display: flex; gap: 6px; margin-bottom: 18px; }
  .setup-progress i { width: 22px; height: 3px; border-radius: 99px; background: var(--line); }
  .setup-progress i.on { background: var(--accent); }
  .door {
    position: fixed; inset: 0; z-index: 35;
    background: #000; color: #f4efe7;
    display: none; place-items: center;
    padding: 28px 22px calc(28px + var(--safe-b));
  }
  .door.on { display: grid; }
  .door-card { width: min(420px, 100%); text-align: left; }
  .door img { width: min(180px, 46vw); height: auto; display: block; margin: 0 auto 22px; }
  .door h2 { font-family: Fraunces, serif; font-size: 32px; margin: 0 0 8px; letter-spacing: -.03em; text-align: center; }
  .door .lead { text-align: center; color: #cfc6ba; margin: 0 0 14px; line-height: 1.45; }
  .door select {
    width: 100%; margin: 0 0 8px; padding: 12px;
    border-radius: 12px; border: 1px solid rgba(244,239,231,.2);
    background: #141210; color: #f4efe7;
  }
  .steps { margin: 0 0 18px; padding: 0; list-style: none; }
  .steps li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(244,239,231,.12); font-size: 15px; }
  .steps b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #f4efe7; color: #111; font-size: 12px; flex: none; }
  .share-glyph { font-size: 18px; line-height: 1; }
  .door .pill { width: 100%; padding: 12px 14px; }
  .door .ghost { color: #cfc6ba; width: 100%; }


  /* ---- additions ---- */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  .door { overflow-y: auto; }
  .door.on { display: flex; }
  .door-card { margin: auto; }
  .link-btn { border: 0; background: transparent; padding: 0; color: var(--accent); text-decoration: underline; font-size: inherit; }
  .meta .del { margin-left: auto; }
  .del { color: var(--muted); }
  .body a, .event a, #panel a { color: var(--accent); word-break: break-word; }
  a.embed { display: block; color: inherit; text-decoration: none; word-break: break-word; }
  textarea { max-height: 220px; }
  .day.today:not(.sel) { outline: 1.5px solid var(--accent); outline-offset: -2px; }
  .day-head { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; }
  .day-head:first-child { margin-top: 0; }
  .event.past { opacity: .6; }
  .card.note { display: block; width: 100%; text-align: left; cursor: pointer; }
  .card.note.unread { outline: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .suggest-list button:hover, .suggest-list button:focus-visible { background: var(--bg-2); }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
    transform: translateX(-50%) translateY(8px); z-index: 50;
    max-width: min(440px, 90vw); padding: 10px 16px; border-radius: 999px;
    background: var(--ink); color: var(--bg); font-size: 13px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .toast.bad { background: #a33a2a; color: #fff; }
</style>
</head>

/* ---------- safe output ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeColor = (c, fb = "#c45c26") => /^#[0-9a-f]{6}$/i.test(c || "") ? c : fb;
const normalizeUrl = u => { u = String(u || "").trim(); return !u ? "" : /^[a-z][a-z0-9+.-]*:\/\//i.test(u) ? u : "https://" + u; };
function safeUrl(u) {
  try { const x = new URL(normalizeUrl(u)); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; }
}
function instagramUrl(u) {
  const href = safeUrl(u);
  if (!href) return "";
  const h = new URL(href).hostname.replace(/^www\./, "");
  return h === "instagram.com" || h.endsWith(".instagram.com") ? href : "";
}
function safeBannerUrl(u) {
  if (!u) return "";
  if (/^data:image\/(jpeg|png|webp|gif);base64,[a-z0-9+/=]+$/i.test(u)) return u;
  return safeUrl(u).replace(/['"()\\\s]/g, c => encodeURIComponent(c));
}
function rich(text) {
  return String(text || "").split(/(https?:\/\/[^\s<]+)/g).map((part, i) => {
    if (i % 2 === 0) return esc(part);
    const m = part.match(/^(.*?)([.,!?)\]]*)$/);
    const href = safeUrl(m[1]);
    return href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(m[1])}</a>${esc(m[2])}` : esc(part);
  }).join("");
}

function ago(t) {
  const s = Math.max(1, (Date.now() - t) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  if (s < 7 * 86400) return Math.floor(s / 86400) + "d";
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

  const s = (t - Date.now()) / 1000;
  if (s <= 0) return "expired";
  if (s < 3600) return "in " + Math.max(1, Math.floor(s / 60)) + "m";
  return "in " + Math.floor(s / 3600) + "h";
}

  const d = startOfDay(new Date());
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));

}

  if (btn) btn.disabled = true;

}

        sb.from("asks").select("id,from_user_id,message,created_at,expires_at").order("created_at", { ascending: false }).limit(100),
        sb.from("ask_responses").select("*"),

        sb.from("event_rsvps").select("*"),
        sb.from("event_reminders").select("*").order("sent_at", { ascending: false }).limit(100)

      const hard = res.slice(0, 6).find(r => r.error);

      const [users, posts, asks, responses, events, rsvps, reminders] = res.map(r => r.data || []);

      state.people = {};
      users.forEach((u, i) => {
        state.people[u.id] = { name: u.display_name || u.email, color: PERSON_COLORS[i % PERSON_COLORS.length], status: u.status || "", bio: u.bio || "" };

      posts.filter(p => p.parent_id).sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at)).forEach(p => {

      }));

      const respMap = {};
      responses.forEach(r => { (respMap[r.ask_id] ||= {})[r.user_id] = r.response; });

        id: a.id, from: a.from_user_id, message: a.message,
        created: Date.parse(a.created_at), expires: Date.parse(a.expires_at), responses: respMap[a.id] || {}
      }));

      const rsvpMap = {}, rsvpTimes = {};
      rsvps.forEach(r => {
        (rsvpMap[r.event_id] ||= {})[r.user_id] = r.status;
        (rsvpTimes[r.event_id] ||= {})[r.user_id] = Date.parse(r.updated_at || "") || 0;
      });
      state.events = events.map(e => ({
        id: e.id, title: e.title, creator: e.creator_id, starts: Date.parse(e.starts_at),
        created: Date.parse(e.created_at) || 0, location: e.location || "", website: e.website || "",
        color: e.color, rsvps: rsvpMap[e.id] || {}, rsvpTimes: rsvpTimes[e.id] || {}
      }));

      state.reminders = res[6].error ? [] : reminders.map(r => ({ event: r.event_id, by: r.sent_by, at: Date.parse(r.sent_at) || 0 }));
      state.loadError = "";
    } catch (err) {
      state.loadError = (err && err.message) || "Couldn't reach the family server.";
    } finally {
      state.loaded = true;
      loading = null;
    }
  })();
  return loading;
}

function resetData() {
  Object.assign(state, { me: null, people: {}, posts: [], asks: [], events: [], reminders: [], loaded: false, loadError: "" });
}

async function ensureProfile() {
  const email = session.user.email.toLowerCase();
  const found = unwrap(await sb.from("users").select("*").eq("email", email).maybeSingle());
  if (found) { state.me = found.id; return; }
  const name = (session.user.user_metadata && (session.user.user_metadata.full_name || session.user.user_metadata.name)) || email.split("@")[0];
  const row = unwrap(await sb.from("users").insert({ google_sub: session.user.id, email, display_name: name }).select().single());
  state.me = row.id;
}

/* ---------- notes (built from real data) ---------- */
function buildNotes() {
  const me = state.me;
  if (!me) return [];
  const cutoff = Date.now() - 14 * DAY, s = state.settings, out = [];
  if (s.replies) {
    state.posts.filter(p => p.author === me).forEach(p => p.replies.forEach(r => {
      if (r.author !== me && r.created > cutoff) out.push({ label: "Reply", tab: "feed", time: r.created, text: `${person(r.author).name} replied: ${clip(r.body, 100)}` });
    }));
  }
  state.asks.forEach(a => {
    if (a.from !== me && a.created > cutoff) {
      const mine = a.responses[me];
      out.push({ label: "Ask", tab: "feed", time: a.created, text: `${person(a.from).name} asked: ${a.message}${mine ? ` (you said ${mine})` : ""}` });
    }
  });
  if (s.events) {
    state.events.forEach(e => {
      if (e.creator !== me && e.created > cutoff && e.starts > Date.now() - DAY) {
        out.push({ label: "Invite", tab: "events", time: e.created, text: `${person(e.creator).name} invited the family to ${e.title}` });
      }
      if (e.creator === me) {
        Object.entries(e.rsvps).forEach(([uid, st]) => {
          const t = e.rsvpTimes[uid] || 0;
          if (uid === me || t < cutoff) return;
          const verb = st === "going" ? "is going to" : st === "maybe" ? "might come to" : "can't make";
          out.push({ label: "RSVP", tab: "events", time: t, text: `${person(uid).name} ${verb} ${e.title}` });
        });
      }
    });
  }
  if (s.reminders) {
    state.reminders.forEach(r => {
      const e = state.events.find(x => x.id === r.event);
      if (e && r.by !== me && r.at > cutoff && !e.rsvps[me] && e.starts > Date.now() - DAY) {
        out.push({ label: "Reminder", tab: "events", time: r.at, text: `${person(r.by).name} is waiting on your RSVP for ${e.title}` });
      }
    });
  }
  return out.sort((a, b) => b.time - a.time).slice(0, 50);
}
function updateDot() {
  const unread = state.tab === "notes" ? 0 : buildNotes().filter(n => n.time > state.seenAt).length;
  $("[data-tab=notes]").classList.toggle("has", unread > 0);
}

/* ---------- shared bits ---------- */
const signedOutPrompt = msg => `<div class="empty">${esc(msg)}<br><button class="pill" data-act="signin" style="margin-top:12px">Sign in</button></div>`;
function needSignIn() { showDoor("signin"); }

/* ---------- feed ---------- */
function renderFeed() {
  const used = asksUsed(), cap = state.settings.cap;
  const liveAsks = state.asks.filter(a => a.expires > Date.now());
  const posts = state.posts.slice().sort((a, b) => b.created - a.created);
  const shown = posts.slice(0, state.feedLimit);

  let banner = "";
  if (!session) banner = `<div class="banner">You're looking around. <button class="link-btn" data-act="signin">Sign in</button> to see and share family posts.</div>`;
  else if (state.loadError) banner = `<div class="banner">Couldn't refresh: ${esc(state.loadError)} <button class="link-btn" data-act="retry">Retry</button></div>`;
  else if (!state.loaded) banner = `<div class="banner">Loading…</div>`;

  const askCard = a => {
    const answered = Object.entries(a.responses).map(([id, r]) => `${nm(id)}: ${esc(r)}`).join(" · ");
    return `<article class="card ask">
      <div class="meta">${avatar(a.from)}<div><strong>${nm(a.from)} asked</strong><div class="time">${ago(a.created)} · expires ${until(a.expires)}</div></div></div>
      <p class="body">${esc(a.message)}</p>
      <div class="chips">${["in", "later", "out"].map(k => `<button class="chip ${a.responses[state.me] === k ? "on" : ""}" data-ask="${esc(a.id)}" data-resp="${k}">${k}</button>`).join("")}</div>
      ${answered ? `<div class="time" style="margin-top:8px">${answered}</div>` : ""}
    </article>`;
  };
  const postCard = p => {
    const ig = p.ig ? instagramUrl(p.ig) : "";
    return `<article class="card">
      <div class="meta">${avatar(p.author)}<div><strong>${nm(p.author)}</strong><div class="time">${ago(p.created)}</div></div>
        ${p.author === state.me ? `<button class="ghost del" data-del-post="${esc(p.id)}" aria-label="Delete post">Delete</button>` : ""}</div>
      ${p.body ? `<p class="body">${rich(p.body)}</p>` : ""}
      ${ig ? `<a class="embed" href="${esc(ig)}" target="_blank" rel="noopener noreferrer"><b>Instagram</b>${esc(new URL(ig).pathname.replace(/\/$/, "") || ig)}<div class="time">Opens in Instagram</div></a>` : ""}
      ${p.replies.length ? `<div class="replies">${p.replies.map(r => `<p><strong>${nm(r.author)}</strong> ${rich(r.body)}${r.author === state.me ? ` <button class="link-btn del" data-del-reply="${esc(r.id)}" aria-label="Delete reply">×</button>` : ""}</p>`).join("")}</div>` : ""}
      <div class="reply-box"><input data-reply="${esc(p.id)}" placeholder="Reply" aria-label="Reply" maxlength="500" /><button class="pill" data-send="${esc(p.id)}">Send</button></div>
    </article>`;
  };

  $("#feed").innerHTML = `
    ${banner}
    <div class="composer">
      ${avatar(state.me)}
      <div style="flex:1">
        <textarea id="postBody" placeholder="A life update, not a highlight reel" aria-label="Post" maxlength="2000"></textarea>
        <input id="igLink" type="text" inputmode="url" placeholder="Paste an Instagram link (optional)" aria-label="Instagram link" />
        <div class="actions">
          <button class="ghost" id="askBtn">Ask family · ${used}/${cap} this week</button>
          <button class="pill" id="postBtn">Share</button>
        </div>
      </div>
    </div>
    ${liveAsks.map(askCard).join("")}
    ${shown.map(postCard).join("")}
    ${session && state.loaded && !state.loadError && !posts.length && !liveAsks.length ? `<div class="empty">Quiet so far. Share a life update to start the feed.</div>` : ""}
    ${posts.length > shown.length ? `<button class="ghost" id="moreBtn" style="width:100%">Show older</button>` : ""}
  `;

  const pb = $("#postBody"), ig = $("#igLink");
  pb.value = drafts.post; ig.value = drafts.ig; grow(pb);
  pb.oninput = () => { drafts.post = pb.value; grow(pb); };
  ig.oninput = () => { drafts.ig = ig.value; };
  $$("[data-reply]").forEach(i => {
    i.value = drafts.reply[i.dataset.reply] || "";
    i.oninput = () => { drafts.reply[i.dataset.reply] = i.value; };
    i.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $(`[data-send="${i.dataset.reply}"]`).click(); } };
  });

  $("#postBtn").onclick = e => guarded(e.currentTarget, async () => {
    if (!signedIn()) return needSignIn();
    const body = drafts.post.trim();
    let link = drafts.ig.trim();
    if (!body && !link) return;
    if (link) {
      link = instagramUrl(link);
      if (!link) throw new Error("That doesn't look like an Instagram link.");
    }
    unwrap(await sb.from("posts").insert({ author_id: state.me, body: body || null, instagram_url: link || null }));
    drafts.post = ""; drafts.ig = "";
    await loadFamily(); render();
  });
  $("#askBtn").onclick = () => { if (!signedIn()) return needSignIn(); openSheet("ask"); };
  $$("[data-resp]").forEach(b => b.onclick = () => guarded(b, async () => {
    if (!signedIn()) return needSignIn();
    unwrap(await sb.from("ask_responses").upsert({ ask_id: b.dataset.ask, user_id: state.me, response: b.dataset.resp }));
    await loadFamily(); render();
  }));
  $$("[data-send]").forEach(b => b.onclick = () => guarded(b, async () => {
    if (!signedIn()) return needSignIn();
    const id = b.dataset.send, text = (drafts.reply[id] || "").trim();
    if (!text) return;
    unwrap(await sb.from("posts").insert({ author_id: state.me, parent_id: id, body: text }));
    delete drafts.reply[id];
    await loadFamily(); render();
  }));
  $$("[data-del-post]").forEach(b => b.onclick = () => deleteRow(b, "posts", b.dataset.delPost, "Delete this post and its replies?"));
  $$("[data-del-reply]").forEach(b => b.onclick = () => deleteRow(b, "posts", b.dataset.delReply, "Delete this reply?"));
  const more = $("#moreBtn");
  if (more) more.onclick = () => { state.feedLimit += 30; render(); };
}

function deleteRow(btn, table, id, question, after) {
  if (!confirm(question)) return;
  return guarded(btn, async () => {
    const rows = unwrap(await sb.from(table).delete().eq("id", id).select("id"));
    if (!rows || !rows.length) throw new Error("The server didn't allow that delete.");
    await loadFamily();
    if (after) after();
    render();
  });
}

/* ---------- notes tab ---------- */
function renderNotes() {
  const items = buildNotes(), base = state.notesBaseline;
  $("#notes").innerHTML = !session ? signedOutPrompt("Sign in to see replies, asks and invites.")
    : items.length ? items.map(n => `<button class="card note${n.time > base ? " unread" : ""}" data-goto="${n.tab}"><strong>${esc(n.label)}</strong><p class="body">${esc(n.text)}</p><div class="time">${ago(n.time)}</div></button>`).join("")
    : `<div class="empty">Nothing waiting. Replies, asks, invites, and reminders land here.</div>`;
  $$("[data-goto]", $("#notes")).forEach(b => b.onclick = () => go(b.dataset.goto));
  state.seenAt = Date.now();
}

/* ---------- events ---------- */
const eventsOn = date => { const s = startOfDay(date).getTime(), e = dayEnd(date).getTime(); return state.events.filter(ev => ev.starts >= s && ev.starts < e); };
function rangeFor(view) {
  const c = state.cursor;
  if (view === "month") return [new Date(c.getFullYear(), c.getMonth(), 1), new Date(c.getFullYear(), c.getMonth() + 1, 1)];
  if (view === "week") {
    const s = startOfDay(c); s.setDate(s.getDate() - ((s.getDay() + 6) % 7));
    const e = new Date(s); e.setDate(e.getDate() + 7);
    return [s, e];
  }
  return [startOfDay(c), dayEnd(c)];
}
function stepCursor(dir) {
  const c = state.cursor, v = state.calView;
  if (v === "month") {
    const last = new Date(c.getFullYear(), c.getMonth() + dir + 1, 0).getDate();
    state.cursor = new Date(c.getFullYear(), c.getMonth() + dir, Math.min(c.getDate(), last));
    state.selectedDay = null;
  } else {
    const d = new Date(c); d.setDate(d.getDate() + dir * (v === "week" ? 7 : 1));
    state.cursor = d;
  }
}

function renderEvents() {
  const view = state.calView, c = state.cursor;
  const [from, to] = rangeFor(view);
  let list = state.events.filter(e => e.starts >= from.getTime() && e.starts < to.getTime()).sort((a, b) => a.starts - b.starts);
  const picked = view === "month" && state.selectedDay;
  if (picked) { const s = startOfDay(state.selectedDay).getTime(), e = dayEnd(state.selectedDay).getTime(); list = list.filter(ev => ev.starts >= s && ev.starts < e); }

  const label = view === "month" ? c.toLocaleString(undefined, { month: "long", year: "numeric" })
    : view === "week" ? `${from.toLocaleDateString(undefined, { month: "short", day: "numeric" })} – ${new Date(to - DAY).toLocaleDateString(undefined, { month: "short", day: "numeric" })}`
    : c.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  const first = new Date(c.getFullYear(), c.getMonth(), 1);
  const pad = (first.getDay() + 6) % 7;
  const count = new Date(c.getFullYear(), c.getMonth() + 1, 0).getDate();
  const cells = [...Array(pad).fill(null), ...Array.from({ length: count }, (_, i) => i + 1)];
  const today = new Date();

  const row = e => {
    const when = new Date(e.starts), past = e.starts < Date.now() - 3 * HOUR;
    const pending = Object.keys(state.people).filter(id => id !== state.me && !e.rsvps[id]);
    return `<div class="event${past ? " past" : ""}" style="border-left:4px solid ${safeColor(e.color)}; padding-left:10px">
      <button class="ghost" data-open="${esc(e.id)}" style="padding:0;font-weight:560;color:var(--ink);text-align:left">${esc(e.title)}</button>
      <div class="time">${when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}${e.location ? " · " + esc(e.location) : ""}</div>
      <div class="chips">
        ${["going", "maybe", "no"].map(s => `<button class="chip ${e.rsvps[state.me] === s ? "on" : ""}" data-rsvp="${esc(e.id)}" data-status="${s}">${s}</button>`).join("")}
        ${!past && pending.length ? `<button class="chip" data-remind="${esc(e.id)}">Remind ${pending.length} quiet</button>` : ""}
      </div>
      ${Object.keys(e.rsvps).length ? `<div class="who">${Object.entries(e.rsvps).map(([id, s]) => `<span class="time">${nm(id)}: ${esc(s)}</span>`).join("")}</div>` : ""}
    </div>`;
  };

  const showHeads = view === "week" || (view === "month" && !picked);
  const groups = [];
  list.forEach(e => {
    const k = startOfDay(e.starts).getTime();
    let g = groups[groups.length - 1];
    if (!g || g.k !== k) { g = { k, items: [] }; groups.push(g); }
    g.items.push(e);
  });
  const empty = view === "day" || picked ? "Nothing on this day." : view === "week" ? "Nothing this week." : "Nothing this month.";

  $("#events").innerHTML = `
    ${session ? "" : `<div class="banner">Sign in to see the family calendar. <button class="link-btn" data-act="signin">Sign in</button></div>`}
    <div class="cal-head">
      <button class="ghost" id="prev" aria-label="Previous">‹</button>
      <strong>${esc(label)}</strong>
      <button class="ghost" id="next" aria-label="Next">›</button>
    </div>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="seg">${["month", "week", "day"].map(v => `<button data-view="${v}" class="${view === v ? "on" : ""}">${v}</button>`).join("")}</div>
      <button class="ghost" id="today">Today</button>
    </div>
    ${view === "month" ? `<div class="month">${["M", "T", "W", "T", "F", "S", "S"].map(d => `<div class="dow">${d}</div>`).join("")}${cells.map(d => {
      if (!d) return "<div></div>";
      const date = new Date(c.getFullYear(), c.getMonth(), d), hits = eventsOn(date);
      const sel = state.selectedDay && sameDay(state.selectedDay, date), isToday = sameDay(today, date);
      return `<button class="day ${sel ? "sel" : ""} ${isToday ? "today" : ""}" data-day="${d}" aria-label="${esc(date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }))}${hits.length ? `, ${hits.length} event${hits.length > 1 ? "s" : ""}` : ""}">${d}<span class="dots">${hits.slice(0, 3).map(e => `<i class="cal-dot" style="background:${safeColor(e.color)}"></i>`).join("")}</span></button>`;
    }).join("")}</div>` : ""}
    ${picked ? `<div class="cal-head" style="margin:12px 0 0"><strong>${esc(state.selectedDay.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }))}</strong><button class="ghost" id="clearDay">Whole month</button></div>` : ""}
    <div class="card" style="margin-top:12px;padding:12px 14px">
      ${groups.map(g => `${showHeads ? `<div class="day-head">${esc(new Date(g.k).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }))}</div>` : ""}${g.items.map(row).join("")}`).join("") || `<div class="empty">${empty}</div>`}
    </div>
    <button class="pill" id="addEvent" style="margin-top:12px">Add invitation</button>
  `;
  $("#prev").onclick = () => { stepCursor(-1); render(); };
  $("#next").onclick = () => { stepCursor(1); render(); };
  $("#today").onclick = () => { state.cursor = startOfDay(new Date()); state.selectedDay = null; render(); };
  $$("[data-view]").forEach(b => b.onclick = () => { state.calView = b.dataset.view; render(); });
  $$("[data-day]").forEach(b => b.onclick = () => {
    const d = new Date(c.getFullYear(), c.getMonth(), +b.dataset.day);
    state.selectedDay = state.selectedDay && sameDay(state.selectedDay, d) ? null : d;
    if (state.selectedDay) state.cursor = d;
    render();
  });
  const clear = $("#clearDay");
  if (clear) clear.onclick = () => { state.selectedDay = null; render(); };
  $$("[data-open]").forEach(b => b.onclick = () => openView(b.dataset.open));
  $$("[data-rsvp]").forEach(b => b.onclick = () => setRsvp(b.dataset.rsvp, b.dataset.status, b, render));
  $$("[data-remind]").forEach(b => b.onclick = () => guarded(b, async () => {
    if (!signedIn()) return needSignIn();
    const e = state.events.find(x => x.id === b.dataset.remind);
    if (state.reminders.some(r => r.event === e.id && Date.now() - r.at < 12 * HOUR)) throw new Error("A reminder already went out in the last 12 hours.");
    const pending = Object.keys(state.people).filter(id => id !== state.me && !e.rsvps[id]);
    if (!pending.length) throw new Error("Everyone has answered.");
    unwrap(await sb.from("event_reminders").insert({ event_id: e.id, sent_by: state.me }));
    await loadFamily(); render();
    toast(`Reminder sent. ${pending.map(id => person(id).name).join(", ")} will see it in Notes.`);
  }));
  $("#addEvent").onclick = () => { if (!signedIn()) return needSignIn(); openSheet("event"); };
}

function setRsvp(id, status, btn, after) {
  if (!signedIn()) return needSignIn();
  return guarded(btn, async () => {
    unwrap(await sb.from("event_rsvps").upsert({ event_id: id, user_id: state.me, status }));
    await loadFamily();
    after();
  });
}

/* ---------- me + settings ---------- */

  $$("[data-theme]").forEach(b => b.onclick = () => { state.theme = b.dataset.theme; applyTheme(); render(); });
  $$("[data-accent]").forEach(b => b.onclick = () => { state.accent = b.dataset.accent; applyTheme(); render(); });
  $$("[data-set]").forEach(b => b.onclick = () => { s[b.dataset.set] = !s[b.dataset.set]; render(); });
  $$("[data-cap]").forEach(b => b.onclick = () => { s.cap = +b.dataset.cap; render(); });
  const out = $("#signOut");
  if (out) out.onclick = async () => { if (confirm("Sign out of Zuniga on this phone?")) await sb.auth.signOut(); };
  $("#replaySetup").onclick = () => startSetup();
  $("#reset").onclick = () => {
    if (!confirm("Reset theme, accent and notification settings on this phone?")) return;
    localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY);
    Object.assign(state, { theme: "system", accent: "clay", settings: defaultSettings(), setupDone: false, calView: "month", seenAt: 0 });
    applyTheme(); render();
  };
}

/* ---------- sheets ---------- */
function openSheet(kind, id) {
  $("#sheet").classList.add("on");
  const panel = $("#panel");
  if (kind === "view") return openView(id);
  if (kind === "event") {
    let banner = "", color = EVENT_COLORS[0];
    const base = state.selectedDay || (state.calView === "day" ? state.cursor : null);
    let def;
    if (base) { def = new Date(base); def.setHours(12, 0, 0, 0); }
    else { def = new Date(Date.now() + HOUR); def.setMinutes(0, 0, 0); }
    panel.innerHTML = `
      <h2 style="font-family:Fraunces,serif;margin:4px 0 12px">Invitation</h2>
      <input id="evTitle" class="field" type="text" maxlength="80" placeholder="Birthday, Sunday, Legoland" aria-label="Title" />
      <input id="evWhen" class="field" type="datetime-local" aria-label="Date and time" value="${toLocalInput(def)}" />
      <div class="suggest">
        <input id="evWhere" class="field" type="text" placeholder="Location" aria-label="Location" autocomplete="off" />
        <div class="suggest-list" id="placeList" hidden></div>
      </div>
      <input id="evSite" class="field" type="text" inputmode="url" placeholder="Website link (optional)" aria-label="Website" />
      <button class="file-btn" id="pickBanner" type="button">Add banner image (optional)</button>
      <input id="evBanner" type="file" accept="image/*" hidden />
      <div id="bannerPreview"></div>
      <div class="time" style="margin-bottom:6px">Calendar color</div>
      <div class="row" style="margin-bottom:12px" id="colorRow">
        ${EVENT_COLORS.map((c, i) => `<button type="button" class="color-pick ${i === 0 ? "on" : ""}" data-color="${c}" aria-label="Color ${i + 1}" style="background:${c}"></button>`).join("")}
      </div>
      <div class="row"><button class="ghost" id="closeSheet">Cancel</button><button class="pill" id="saveEvent">Invite family</button></div>`;
    const where = $("#evWhere");
    let timer;
    where.oninput = () => { clearTimeout(timer); const q = where.value.trim(); timer = setTimeout(() => suggestPlaces(q), 220); };
    $("#pickBanner").onclick = () => $("#evBanner").click();
    $("#evBanner").onchange = async () => {
      const file = $("#evBanner").files[0];
      if (!file) return;
      try {
        banner = await compressImage(file);
        $("#bannerPreview").innerHTML = `<div class="event-banner" id="bannerImg"></div>`;
        $("#bannerImg").style.backgroundImage = `url('${banner}')`;
      } catch { toast("Couldn't read that image.", true); }
    };
    $$("[data-color]").forEach(b => b.onclick = () => { color = b.dataset.color; $$("[data-color]").forEach(x => x.classList.toggle("on", x === b)); });
    $("#saveEvent").onclick = e => guarded(e.currentTarget, async () => {
      if (!signedIn()) return needSignIn();
      const title = $("#evTitle").value.trim(), when = $("#evWhen").value;
      if (!title) throw new Error("Give the invitation a title.");
      if (!when) throw new Error("Pick a date and time.");
      const siteRaw = $("#evSite").value.trim(), site = siteRaw ? safeUrl(siteRaw) : "";
      if (siteRaw && !site) throw new Error("That website link doesn't look right.");
      const created = unwrap(await sb.from("events").insert({
        creator_id: state.me, title, starts_at: new Date(when).toISOString(),
        location: where.value.trim() || null, website: site || null, color, banner_url: banner || null
      }).select("id").single());
      unwrap(await sb.from("event_rsvps").upsert({ event_id: created.id, user_id: state.me, status: "going" }));
      const d = new Date(when);
      state.cursor = startOfDay(d); state.selectedDay = null;
      closeSheet();
      await loadFamily(); render();
      toast("Invitation sent.");
    });
  } else if (kind === "ask") {
    const left = Math.max(0, state.settings.cap - asksUsed());
    panel.innerHTML = `
      <h2 style="font-family:Fraunces,serif;margin:4px 0 6px">Ask the family</h2>
      <p class="time" style="margin:0 0 10px">${left} of ${state.settings.cap} asks left this week. An ask disappears after 24 hours.</p>
      <input id="askMsg" class="field" type="text" maxlength="140" value="${esc(ASK_IDEAS[0])}" aria-label="Your question" />
      <div class="chips" style="margin:0 0 12px">${ASK_IDEAS.map(t => `<button class="chip" data-idea="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <div class="row"><button class="ghost" id="closeSheet">Cancel</button><button class="pill" id="sendAsk">Ask</button></div>`;
    $$("[data-idea]").forEach(b => b.onclick = () => { $("#askMsg").value = b.dataset.idea; });
    $("#sendAsk").onclick = e => guarded(e.currentTarget, async () => {
      if (!signedIn()) return needSignIn();
      if (asksUsed() >= state.settings.cap) throw new Error("Weekly ask cap reached. It resets Monday.");
      const message = $("#askMsg").value.trim();
      if (!message) return;
      unwrap(await sb.from("asks").insert({ from_user_id: state.me, message }));
      closeSheet();
      await loadFamily(); render();
    });
  } else if (kind === "profile") {
    const me = person(state.me);
    panel.innerHTML = `
      <h2 style="font-family:Fraunces,serif;margin:4px 0 12px">Your profile</h2>
      <input id="pfName" class="field" type="text" maxlength="40" value="${esc(me.name)}" placeholder="Name" aria-label="Name" />
      <input id="pfStatus" class="field" type="text" maxlength="80" value="${esc(me.status)}" placeholder="Status, like “at the park”" aria-label="Status" />
      <input id="pfBio" class="field" type="text" maxlength="80" value="${esc(me.bio)}" placeholder="A short line about you" aria-label="Bio" />
      <div class="row"><button class="ghost" id="closeSheet">Cancel</button><button class="pill" id="savePf">Save</button></div>`;
    $("#savePf").onclick = e => guarded(e.currentTarget, async () => {
      const display_name = $("#pfName").value.trim();
      if (!display_name) throw new Error("Name can't be empty.");
      const rows = unwrap(await sb.from("users").update({ display_name, status: $("#pfStatus").value.trim() || null, bio: $("#pfBio").value.trim() || null }).eq("id", state.me).select("id"));
      if (!rows || !rows.length) throw new Error("The server didn't allow that change.");
      closeSheet();
      await loadFamily(); render();
    });
  } else {
    panel.innerHTML = `
      <h2 style="font-family:Fraunces,serif;margin:4px 0 12px">New</h2>
      <button class="pill" id="goPost" style="width:100%;margin-bottom:8px">Life update</button>
      <button class="ghost" id="goAsk">Ask the family</button>
      <button class="ghost" id="goEvent">Invitation</button>
      <button class="ghost" id="closeSheet">Close</button>`;
    $("#goPost").onclick = () => { closeSheet(); go("feed"); const pb = $("#postBody"); if (pb) pb.focus(); };
    $("#goAsk").onclick = () => { if (!signedIn()) { closeSheet(); return needSignIn(); } openSheet("ask"); };
    $("#goEvent").onclick = () => { if (!signedIn()) { closeSheet(); return needSignIn(); } openSheet("event"); };
  }
  $("#closeSheet").onclick = closeSheet;
  const firstField = $("input:not([type=file]):not([hidden])", panel);
  if (firstField && kind !== "new") firstField.focus({ preventScroll: true });
}

function openView(id) {
  const e = state.events.find(x => x.id === id);
  if (!e) return closeSheet();
  $("#sheet").classList.add("on");
  const when = new Date(e.starts);
  const site = safeUrl(e.website);
  const groups = ["going", "maybe", "no"].map(st => {
    const names = Object.entries(e.rsvps).filter(([, s]) => s === st).map(([uid]) => nm(uid));
    return names.length ? `${st === "no" ? "Can't make it" : st[0].toUpperCase() + st.slice(1)}: ${names.join(", ")}` : "";
  }).filter(Boolean);
  const quiet = Object.keys(state.people).filter(uid => !e.rsvps[uid]).map(nm);
  if (quiet.length) groups.push(`No reply: ${quiet.join(", ")}`);
  $("#panel").innerHTML = `
    <div class="event-banner" id="viewBanner" style="background:${safeColor(e.color)}"></div>
    <h2 style="font-family:Fraunces,serif;margin:0 0 6px">${esc(e.title)}</h2>
    <div class="time">${esc(when.toLocaleString(undefined, { weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" }))}</div>
    ${e.location ? `<p class="body"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location)}" target="_blank" rel="noopener noreferrer">${esc(e.location)}</a></p>` : ""}
    ${site ? `<p class="body"><a href="${esc(site)}" target="_blank" rel="noopener noreferrer">${esc(new URL(site).hostname.replace(/^www\./, ""))}</a></p>` : ""}
    <div class="chips">${["going", "maybe", "no"].map(s => `<button class="chip ${e.rsvps[state.me] === s ? "on" : ""}" data-rsvp="${esc(e.id)}" data-status="${s}">${s}</button>`).join("")}</div>
    ${groups.length ? `<p class="time" style="line-height:1.6">${groups.join("<br>")}</p>` : ""}
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="ghost" id="closeSheet">Close</button>
      ${e.creator === state.me ? `<button class="ghost del" id="delEvent">Delete event</button>` : ""}
    </div>`;
  $$("[data-rsvp]", $("#panel")).forEach(b => b.onclick = () => setRsvp(e.id, b.dataset.status, b, () => { openView(id); render(); }));
  const del = $("#delEvent");
  if (del) del.onclick = () => deleteRow(del, "events", e.id, "Delete this event for everyone?", closeSheet);
  $("#closeSheet").onclick = closeSheet;
  ensureBanner(id).then(url => { const el = $("#viewBanner"); if (el && url) el.style.backgroundImage = `url('${url}')`, el.style.backgroundSize = "cover", el.style.backgroundPosition = "center"; });
}

async function ensureBanner(id) {
  if (id in state.bannerCache) return state.bannerCache[id];
  if (!sb || !session) return "";
  const { data, error } = await sb.from("events").select("banner_url").eq("id", id).maybeSingle();
  const url = error ? "" : safeBannerUrl(data && data.banner_url);
  state.bannerCache[id] = url;
  return url;
}

let placeAbort;
async function suggestPlaces(q) {
  const list = $("#placeList");
  if (!list) return;
  if (q.length < 2) { list.hidden = true; return; }
  const ql = q.toLowerCase();
  const recent = [...new Set(state.events.map(e => e.location).filter(Boolean))];
  const local = [...recent, ...FAMILY_PLACES].filter(p => p.toLowerCase().includes(ql));
  const paint = items => {
    items = [...new Set(items)].slice(0, 6);
    if (!items.length) { list.hidden = true; return; }
    list.hidden = false;
    list.innerHTML = items.map(p => `<button type="button" data-place="${esc(p)}">${esc(p)}</button>`).join("");
    $$("[data-place]", list).forEach(b => b.onclick = () => { $("#evWhere").value = b.dataset.place; list.hidden = true; });
  };
  paint(local);
  if (placeAbort) placeAbort.abort();
  placeAbort = new AbortController();
  try {
    const res = await fetch("https://photon.komoot.io/api/?limit=5&lang=en&q=" + encodeURIComponent(q), { signal: placeAbort.signal });
    if (!res.ok) return;
    const data = await res.json();
    const remote = (data.features || []).map(f => { const p = f.properties || {}; return [p.name, p.city || p.county, p.state, p.country].filter(Boolean).join(", "); });
    if ($("#placeList")) paint([...local, ...remote]);
  } catch {}
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 800 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}
function closeSheet() { $("#sheet").classList.remove("on"); }
$("#composeOpen").onclick = () => openSheet("new");
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- render + navigation ---------- */
function render() {
  applyTheme();
  const tab = state.tab;
  $$(".screen").forEach(s => s.classList.toggle("on", s.id === tab));
  $$("nav.tab button").forEach(b => {
    const on = b.dataset.tab === (tab === "settings" ? "me" : tab);
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  ({ feed: renderFeed, notes: renderNotes, events: renderEvents, me: renderMe, settings: renderSettings })[tab]();
  updateDot();
  save();
}
function go(tab) {
  if (tab === "notes" && state.tab !== "notes") state.notesBaseline = state.seenAt;
  state.tab = tab;
  render();
  window.scrollTo(0, 0);
}
$$("nav.tab button").forEach(b => b.onclick = () => go(b.dataset.tab));
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "signin") needSignIn();
  if (b.dataset.act === "retry") refresh(true);
});

/* ---------- refresh ---------- */
const isEditing = () => { const a = document.activeElement; return !!(a && a.matches("input, textarea") && a.closest("main")); };
let pollTimer;
async function refresh(force) {
  if (!session || !state.me) return;
  await loadFamily();
  if (force || !isEditing()) render(); else updateDot();
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 45000);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
addEventListener("online", () => refresh());

/* ---------- setup flow ---------- */
const installed = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
let setupStep = 0;
function startSetup() { setupStep = 0; $("#setup").classList.add("on"); drawSetup(); }
function drawSetup() {
  const s = state.settings;
  const dots = [0, 1, 2, 3, 4].map(i => `<i class="${i === setupStep ? "on" : ""}"></i>`).join("");
  const steps = [
    `<div class="setup-progress">${dots}</div><h2>This is the family hub.</h2><p>Feed for life updates. Notes when someone replies or asks. Events for invitations. Me for your profile. It sits next to the sibling chat. It does not replace it.</p>`,
    `<div class="setup-progress">${dots}</div><h2>Theme</h2><p>Light, dark, or follow the phone. You can change this later in Settings.</p><div class="seg">${["system", "light", "dark"].map(t => `<button data-theme="${t}" class="${state.theme === t ? "on" : ""}">${t}</button>`).join("")}</div>`,
    `<div class="setup-progress">${dots}</div><h2>Your accent</h2><p>This colors buttons and your side of the app. It does not change anyone else's phone.</p><div class="row" style="gap:10px">${[["clay", "#c45c26"], ["olive", "#3e5344"], ["ink", "#243044"], ["gold", "#a57a2d"]].map(([k, c]) => `<button class="swatch ${state.accent === k ? "on" : ""}" data-accent="${k}" aria-label="${k} accent" style="background:${c}"></button>`).join("")}</div>`,
    `<div class="setup-progress">${dots}</div><h2>Home screen mark</h2><img class="home-icon" src="icon-180.png" alt="Gold Z on black" /><p>iPhone locks this icon when you add the app. It is the family Z, gold on black, with the usual rounded corners. It cannot be a different logo per person unless the shortcut is removed and added again.</p>`,
    `<div class="setup-progress">${dots}</div><h2>What shows in Notes</h2><p>Asks are capped so this does not become a second group chat.</p>
      ${[["replies", "Replies"], ["events", "Invites"], ["reminders", "Reminders"]].map(([k, label]) => `<div class="switch-row"><span>${label}</span><button class="chip ${s[k] ? "on" : ""}" data-set="${k}">${s[k] ? "On" : "Off"}</button></div>`).join("")}
      <div class="chips" style="margin-top:8px">${[1, 3, 5].map(n => `<button class="chip ${s.cap === n ? "on" : ""}" data-cap="${n}">${n} asks / week</button>`).join("")}</div>`
  ];
  const panel = $("#setupPanel");
  panel.innerHTML = steps[setupStep] + `<div class="row" style="margin-top:18px;justify-content:space-between"><button class="ghost" id="setupSkip">${setupStep === 0 ? "Not now" : "Back"}</button><button class="pill" id="setupNext">${setupStep === 4 ? "Enter" : "Continue"}</button></div>`;
  $$("[data-theme]", panel).forEach(b => b.onclick = () => { state.theme = b.dataset.theme; save(); applyTheme(); drawSetup(); });
  $$("[data-accent]", panel).forEach(b => b.onclick = () => { state.accent = b.dataset.accent; save(); applyTheme(); drawSetup(); });
  $$("[data-set]", panel).forEach(b => b.onclick = () => { s[b.dataset.set] = !s[b.dataset.set]; save(); drawSetup(); });
  $$("[data-cap]", panel).forEach(b => b.onclick = () => { s.cap = +b.dataset.cap; save(); drawSetup(); });
  $("#setupSkip").onclick = () => {
    if (setupStep === 0) { state.setupDone = true; save(); $("#setup").classList.remove("on"); render(); return; }
    setupStep -= 1; drawSetup();
  };
  $("#setupNext").onclick = () => {
    if (setupStep < 4) { setupStep += 1; drawSetup(); return; }
    state.setupDone = true; save(); $("#setup").classList.remove("on"); render();
  };
}

/* ---------- door (install + sign in) ---------- */
const platformSteps = {
  iphone: ["Open this page in Safari, not Chrome", "Tap Share, the square with the arrow", "Tap Add to Home Screen, then Add"],
  android: ["Open this page in Chrome", "Tap the three dots, then Install app", "If that is missing, tap Add to Home screen, then Install"]
};
function drawPlatform(which) {
  $("#platform").value = which;
  $("#platformSteps").innerHTML = platformSteps[which].map((step, i) => `<li><b>${i + 1}</b><span>${step}</span></li>`).join("");
}
$("#platform").onchange = () => drawPlatform($("#platform").value);
drawPlatform(/android/i.test(navigator.userAgent) ? "android" : "iphone");

function showDoor(mode) {
  const install = mode === "install";
  $("#installBox").hidden = !install;
  $("#signBox").hidden = !!session;
  $("#signClose").hidden = install;
  $("#door").classList.add("on");
}
function maybeDoor() {
  const dismissed = sessionStorage.getItem("zuniga-door") || localStorage.getItem("zuniga-door-day") === new Date().toDateString();
  if (installed()) { if (!session) showDoor("signin"); return; }
  if (!dismissed) showDoor("install");
}
$("#doorHide").onclick = () => { sessionStorage.setItem("zuniga-door", "1"); $("#door").classList.remove("on"); };
$("#doorLater").onclick = () => { localStorage.setItem("zuniga-door-day", new Date().toDateString()); $("#door").classList.remove("on"); };
$("#signClose").onclick = () => $("#door").classList.remove("on");

const authMsg = t => { $("#authMsg").textContent = t; };
const authDown = () => authMsg("Couldn't reach the sign-in service. Check your connection and reload.");
async function sendMagic() {
  if (!sb) return authDown();
  const email = $("#magicEmail").value.trim();
  if (!email) return authMsg("Type your email first.");
  const btn = $("#magicBtn");
  btn.disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: REDIRECT } });
  btn.disabled = false;
  authMsg(error ? error.message : "Check that inbox for the link. Open it in the same browser you're using now.");
}
$("#magicBtn").onclick = sendMagic;
$("#magicEmail").onkeydown = e => { if (e.key === "Enter") sendMagic(); };
$("#googleBtn").onclick = async () => {
  if (!sb) return authDown();
  const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: REDIRECT } });
  if (error) authMsg(error.message);
};

/* ---------- auth + boot ---------- */
let entering = false;
let booted = false;
function cleanUrl() {
  if (location.search.includes("code=") || location.hash.includes("access_token")) history.replaceState(null, "", location.pathname);
}
async function enterApp() {
  if (entering) return;
  entering = true;
  try {
    await ensureProfile();
    await loadFamily();
    if (!state.seenAt) state.seenAt = Date.now() - DAY;
    $("#door").classList.remove("on");
    cleanUrl();
    render();
    startPolling();
    if (installed() && !state.setupDone) startSetup();
  } catch (err) {
    const msg = (err && err.message) || "";
    authMsg(/row-level security|violates|permission|denied/i.test(msg) ? "That account isn't on the family list yet." : (msg || "Couldn't sign in."));
    try { await sb.auth.signOut(); } catch {}
    session = null; resetData(); render();
    showDoor("signin");
  } finally {
    entering = false;
  }
}
if (sb) {
  sb.auth.onAuthStateChange((event, next) => {
    if (event === "SIGNED_OUT") {
      session = null; resetData(); clearInterval(pollTimer); render();
      if (booted) maybeDoor();
      return;
    }
    if (event === "SIGNED_IN" && next && (!session || session.user.id !== next.user.id)) {
      session = next;
      setTimeout(enterApp, 0);
    } else if (next) {
      session = next;
    }
  });
}
(async function boot() {
  render();
  const fromIcon = installed(), splash = $("#splash");
  if (!fromIcon && splash) splash.remove();
  if (sb) {
    try { const { data } = await sb.auth.getSession(); session = data.session || session; } catch {}
  }
  if (fromIcon && splash) { await wait(500); splash.classList.add("out"); setTimeout(() => splash.remove(), 700); }
  if (session && !state.me) await enterApp();
  booted = true;
  maybeDoor();
})();

if ("serviceWorker" in navigator) {
  addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
